name: CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate inline JS in HTML (zero-dep)
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const m=s.match(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/g)||[];let n=0;m.forEach((b)=>{const c=b.replace(/<\\/?script[^>]*>/g,'');if(c.trim()){new Function(c);n++;}});console.log('validated '+n+' inline script block(s)');"
      - name: Syntax check loose JS files
        run: |
          for f in *.js; do [ -f "$f" ] && node --check "$f"; done